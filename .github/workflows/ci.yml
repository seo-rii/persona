name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Download modules
        working-directory: ${{ github.workspace }}
        run: go mod download

      - name: Go test (race)
        working-directory: ${{ github.workspace }}
        run: go test -race ./cmd/... ./internal/...

      - name: Go vet
        working-directory: ${{ github.workspace }}
        run: go vet ./...

  test:
    needs: fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Verify overlayfs + mount namespace
        run: |
          sudo modprobe overlay || true
          if ! grep -q overlay /proc/filesystems; then
            echo "overlayfs not available" >&2
            exit 1
          fi
          sudo unshare -m true

      - name: Download modules
        working-directory: ${{ github.workspace }}
        run: go mod download

      - name: Run tests (unit + integration)
        working-directory: ${{ github.workspace }}
        run: bash ./test.sh
