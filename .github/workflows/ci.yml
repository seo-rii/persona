name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Download modules
        working-directory: ${{ github.workspace }}
        run: go mod download

      - name: Go test (race)
        working-directory: ${{ github.workspace }}
        run: go test -race -shuffle=on -count=3 ./cmd/... ./internal/...

      - name: Go vet
        working-directory: ${{ github.workspace }}
        run: go vet ./...

  test:
    needs: fast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Verify overlayfs + mount namespace
        run: |
          sudo modprobe overlay || true
          if ! grep -q overlay /proc/filesystems; then
            echo "overlayfs not available" >&2
            exit 1
          fi
          sudo unshare -m true

      - name: Download modules
        working-directory: ${{ github.workspace }}
        run: go mod download

      - name: Run tests (unit + integration)
        working-directory: ${{ github.workspace }}
        run: bash ./test.sh

      - name: Repeat daemon persistence and recovery in private mount namespaces
        run: |
          sudo env "PATH=$PATH" PERSONA_INTEGRATION=1 \
            "$(command -v go)" test -count=3 -shuffle=on ./integration -run '^TestPersonaIntegrationDaemon'

      - name: Verify non-root file capability execution
        run: |
          go build -o "$RUNNER_TEMP/persona-capability" ./cmd/persona
          sudo setcap cap_sys_admin+ep "$RUNNER_TEMP/persona-capability"
          PERSONA_CAPABILITY_TEST=1 PERSONA_CAPABILITY_BIN="$RUNNER_TEMP/persona-capability" \
            go test -count=2 ./integration -run '^TestPersonaIntegrationCapabilityPath$'

  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [FuzzValidatePatchPaths, FuzzFilterExistingNewFiles, FuzzGitPatchRoundTrip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Check patch invariants
        run: go test ./internal/patchio -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s -parallel=2
